<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Master Lean Construction principles through an interactive visual novel game" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FlowState" />
  <link rel="icon" type="image/png" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta property="og:title" content="FlowState - A Lean Construction Story" />
  <meta property="og:description"
    content="Master the Flow. Eliminate the Waste. Learn Lean Construction through gameplay." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/icons/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="splash-screen"
    style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;transition:opacity 0.5s ease-out,visibility 0.5s ease-out;">
    <div
      style="display:flex;flex-direction:column;align-items:center;gap:28px;max-width:380px;padding:0 24px;text-align:center;">
      <div
        style="width:220px;height:180px;border-radius:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(59,130,246,0.3);animation:splash-float 3s ease-in-out infinite;overflow:hidden;border:2px solid rgba(59,130,246,0.2);background:rgba(15,23,42,0.6);padding:12px;">
        <img src="/favicon.png" alt="FlowState Logo" style="width:100%;height:100%;object-fit:contain;" />
      </div>
      <div>
        <div
          style="font-family:Inter,system-ui,sans-serif;font-size:36px;font-weight:900;color:#fff;letter-spacing:-0.5px;line-height:1;">
          FLOW<span style="color:#22d3ee;">STATE</span></div>
        <div
          style="font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:4px;margin-top:6px;">
          A Lean Construction Story</div>
      </div>
      <div style="display:flex;gap:6px;">
        <span class="splash-dot" style="animation-delay:0s;"></span>
        <span class="splash-dot" style="animation-delay:0.15s;"></span>
        <span class="splash-dot" style="animation-delay:0.3s;"></span>
        <span class="splash-dot" style="animation-delay:0.45s;"></span>
        <span class="splash-dot" style="animation-delay:0.6s;"></span>
      </div>
      <div id="splash-tip"
        style="background:rgba(15,23,42,0.8);border:1px solid #1e293b;border-radius:12px;padding:14px 18px;max-width:340px;opacity:0;animation:splash-fade-in 0.6s ease-out 0.4s forwards;">
        <div
          style="font-family:Inter,system-ui,sans-serif;font-size:9px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:3px;margin-bottom:6px;">
          Lean Principle</div>
        <div id="splash-tip-text"
          style="font-family:Inter,system-ui,sans-serif;font-size:13px;color:#94a3b8;line-height:1.5;"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var tips = [
        "Kanban limits Work-In-Progress to maximize throughput and expose bottlenecks on the construction site.",
        "The Last Planner System builds reliability: only promise work that CAN be done, not what SHOULD be done.",
        "5S (Sort, Set in Order, Shine, Standardize, Sustain) eliminates the 7 wastes of searching and motion.",
        "Pull Systems let downstream demand trigger upstream work \u2014 never push unready tasks onto the crew.",
        "Percent Plan Complete (PPC) measures planning reliability, not just productivity.",
        "Takt Time Planning synchronizes trade handoffs so work flows continuously without waiting.",
        "Constraint Analysis finds blockers before they hit the site \u2014 the foundation of reliable planning.",
        "Muda (Waste): Overproduction is the worst form of waste because it generates all other wastes.",
        "Visual Management makes work status visible to everyone \u2014 if you can see it, you can manage it.",
        "Continuous Improvement (Kaizen): Small daily gains on site compound into transformational project outcomes."
      ];
      var el = document.getElementById("splash-tip-text");
      if (el) el.textContent = tips[Math.floor(Math.random() * tips.length)];
    })();
  </script>
  <style>
    @keyframes splash-float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-10px)
      }
    }

    @keyframes splash-pulse {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.8)
      }

      50% {
        opacity: 1;
        transform: scale(1.2)
      }
    }

    @keyframes splash-fade-in {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .splash-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3b82f6;
      animation: splash-pulse 1.2s ease-in-out infinite;
    }
  </style>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
