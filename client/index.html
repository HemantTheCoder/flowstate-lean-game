<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Master Lean Construction principles through an interactive visual novel game" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlowState" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="FlowState - A Lean Construction Story" />
    <meta property="og:description" content="Master the Flow. Eliminate the Waste. Learn Lean Construction through gameplay." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="splash-screen" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;transition:opacity 0.5s ease-out,visibility 0.5s ease-out;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:28px;max-width:380px;padding:0 24px;text-align:center;">
        <div style="width:72px;height:72px;background:linear-gradient(135deg,#3b82f6,#06b6d4);border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(59,130,246,0.3);animation:splash-wobble 2s ease-in-out infinite;">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a2 2 0 0 0 4 0V4.5a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5Z"/><path d="M3.58 8.3a1 1 0 0 0-.58.95v.2a1 1 0 0 0 .29.71l.5.5a1 1 0 0 0 .71.29H7.5"/><path d="M16.5 11h3a1 1 0 0 0 .71-.29l.5-.5a1 1 0 0 0 .29-.71v-.2a1 1 0 0 0-.58-.95"/><path d="M6 15a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v0a2 2 0 0 0-2-2"/></svg>
        </div>
        <div>
          <div style="font-family:Inter,system-ui,sans-serif;font-size:36px;font-weight:900;color:#fff;letter-spacing:-0.5px;line-height:1;">FLOW<span style="color:#22d3ee;">STATE</span></div>
          <div style="font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:4px;margin-top:6px;">A Lean Construction Story</div>
        </div>
        <div style="display:flex;gap:6px;">
          <span class="splash-dot" style="animation-delay:0s;"></span>
          <span class="splash-dot" style="animation-delay:0.15s;"></span>
          <span class="splash-dot" style="animation-delay:0.3s;"></span>
          <span class="splash-dot" style="animation-delay:0.45s;"></span>
          <span class="splash-dot" style="animation-delay:0.6s;"></span>
        </div>
      </div>
    </div>
    <style>
      @keyframes splash-wobble { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(10deg)} 75%{transform:rotate(-10deg)} }
      @keyframes splash-pulse { 0%,100%{opacity:0.2;transform:scale(0.8)} 50%{opacity:1;transform:scale(1.2)} }
      .splash-dot{width:10px;height:10px;border-radius:50%;background:#3b82f6;animation:splash-pulse 1.2s ease-in-out infinite;}
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
